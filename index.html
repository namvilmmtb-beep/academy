<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Образовательная Платформа</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .hidden { display: none !important; }
        button { background-color: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #357ae8; }
        .btn-logout { background-color: #d9534f; float: right; padding: 8px 15px; font-size: 14px; }
        .card { background: #fafafa; padding: 15px; border-left: 4px solid #4285F4; margin-bottom: 15px; border-radius: 4px; text-align: left; }
        .admin-zone { border-left-color: #e67e22; background: #fff5eb; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        h1, h2 { color: #2c3e50; }
        #error-logger { color: #d9534f; background: #fdf2f2; padding: 10px; border-radius: 4px; margin-top: 15px; font-family: monospace; font-size: 13px; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <div id="error-logger" class="hidden"></div>

    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen">
        <h1>Добро пожаловать в Академию</h1>
        <p>Для получения знаний и прохождения тестов авторизуйтесь через Gmail аккаунт.</p>
        <br>
        <button id="btn-login">Войти через Google (Gmail)</button>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="main-screen" class="hidden">
        <div style="border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; text-align: left;">
            Добро пожаловать, <strong id="user-name">Загрузка...</strong> 
            <span id="user-role" style="font-size:12px; padding:3px 8px; background:#ddd; border-radius:10px; margin-left:10px;">Студент</span>
            <button id="btn-logout" class="btn-logout">Выйти</button>
        </div>

        <!-- АДМИН ПАНЕЛЬ -->
        <div id="admin-panel" class="card admin-zone hidden">
            <h2>Панель администратора</h2>
            <input type="text" id="lecture-title" placeholder="Название лекции">
            <textarea id="lecture-content" rows="4" placeholder="Содержимое лекции..."></textarea>
            <button id="btn-add-lecture" style="background-color: #e67e22;">Опубликовать лекцию</button>
        </div>

        <!-- КОНТЕНТ СТУДЕНТА -->
        <div id="student-panel">
            <h2 style="text-align: left;">Доступные знания и лекции</h2>
            <div id="lectures-container">Загрузка лекций...</div>
        </div>
    </div>
</div>

<!-- Модуль 2: Вшитый локальный адаптер-заглушка для работы авторизации и Firestore напрямую через REST без внешних скриптов -->
<script>
document.addEventListener("DOMContentLoaded", function() {
    function showRuntimeError(message) {
        var logger = document.getElementById('error-logger');
        logger.classList.remove('hidden');
        logger.innerHTML += "<div><strong>Ошибка:</strong> " + message + "</div>";
    }

    try {
        var firebaseConfig = {
          apiKey: "AIzaSyBA2CM4hDgqFB1zrwE5es3JgMsA2Aupygo",
          authDomain: "://firebaseapp.com",
          projectId: "phdtest-95627"
        };

        var ADMIN_EMAILS = ["nam.vil.mmtb@gmail.com"];
        var currentUser = null;

        // Прямой вызов окна логина Google через нативное защищенное окно Google OAuth
        document.getElementById('btn-login').addEventListener('click', function() {
            var authUrl = "https://google.com" +
                          "&redirect_uri=" + encodeURIComponent(window.location.href) +
                          "&response_type=token&scope=profile%20email";
            window.location.href = authUrl;
        });

        document.getElementById('btn-logout').addEventListener('click', function() {
            localStorage.removeItem('user_session');
            window.location.href = window.location.pathname;
        });

        // Проверяем, вернулся ли пользователь после успешного входа Google OAuth
        var hash = window.location.hash;
        if (hash && hash.includes("access_token")) {
            var token = hash.split("&")[0].split("=")[1];
            // Запрашиваем профиль пользователя напрямую из Google API
            fetch("https://googleapis.com" + token)
                .then(function(res) { return res.json(); })
                .then(function(profile) {
                    if (profile && profile.email) {
                        currentUser = {
                            displayName: profile.name || profile.given_name,
                            email: profile.email
                        };
                        localStorage.setItem('user_session', JSON.stringify(currentUser));
                        window.location.hash = ""; // Очищаем адресную строку
                        renderInterface();
                    }
                }).catch(function(e) { showRuntimeError("Google API Error: " + e.message); });
        } else {
            // Проверяем сохраненную сессию
            var saved = localStorage.getItem('user_session');
            if (saved) {
                currentUser = JSON.parse(saved);
                renderInterface();
            }
        }

        function renderInterface() {
            if (!currentUser) return;
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-screen').classList.remove('hidden');
            document.getElementById('user-name').innerText = currentUser.displayName;

            if (currentUser.email && ADMIN_EMAILS.includes(currentUser.email.toLowerCase().trim())) {
                document.getElementById('user-role').innerText = "Администратор";
                document.getElementById('user-role').style.background = "#e67e22";
                document.getElementById('user-role').style.color = "white";
                document.getElementById('admin-panel').classList.remove('hidden');
            } else {
                document.getElementById('user-role').innerText = "Студент";
                document.getElementById('user-role').style.background = "#2ecc71";
                document.getElementById('user-role').style.color = "white";
                document.getElementById('admin-panel').classList.add('hidden');
            }
            loadLecturesRest();
        }
