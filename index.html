<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Академия Знаний</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .hidden { display: none !important; }
        button { background-color: #4285F4; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button:hover { background-color: #357ae8; }
        .btn-logout { background-color: #d9534f; float: right; padding: 8px 15px; font-size: 14px; }
        .btn-logout:hover { background-color: #c9302c; }
        .card { background: #fafafa; padding: 15px; border-left: 4px solid #4285F4; margin-bottom: 15px; border-radius: 4px; text-align: left; }
        .admin-zone { border-left-color: #e67e22; background: #fff5eb; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        h1, h2 { color: #2c3e50; }
        .toggle-auth { color: #4285F4; cursor: pointer; text-decoration: underline; margin-top: 15px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">

    <!-- Формы авторизации (Вход / Регистрация) -->
    <div id="auth-screen">
        <h1 id="auth-title">Вход в Академию</h1>
        <p id="auth-desc">Введите свои данные для доступа к учебным материалам.</p>
        
        <div id="form-fields">
            <!-- Поле имени нужно только для регистрации -->
            <input type="text" id="user-name-input" placeholder="Ваше Имя" class="hidden">
            <input type="email" id="user-email-input" placeholder="Электронная почта (Email)">
            <input type="password" id="user-password-input" placeholder="Пароль">
            <br><br>
            <button id="btn-submit-auth">Войти</button>
        </div>
        
        <span id="toggle-auth-mode" class="toggle-auth">Нет аккаунта? Зарегистрироваться</span>
    </div>

    <!-- Главный экран платформы -->
    <div id="main-screen" class="hidden">
        <div style="border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px; text-align: left;">
            Добро пожаловать, <strong id="user-display-name">Загрузка...</strong> 
            <span id="user-role" style="font-size:12px; padding:3px 8px; background:#ddd; border-radius:10px; margin-left:10px; color: white;">Студент</span>
            <button id="btn-logout" class="btn-logout">Выйти</button>
        </div>

        <!-- ПАНЕЛЬ АДМИНИСТРАТОРА -->
        <div id="admin-panel" class="card admin-zone hidden">
            <h2>Панель администратора</h2>
            <p>Здесь вы можете публиковать новые лекции для ваших студентов.</p>
            <input type="text" id="lecture-title" placeholder="Название лекции">
            <textarea id="lecture-content" rows="5" placeholder="Текст лекции или ссылка на видеоурок..."></textarea>
            <button id="btn-add-lecture" style="background-color: #e67e22;">Опубликовать лекцию</button>
        </div>

        <!-- ЛЕНТА ЗНАНИЙ ДЛЯ СТУДЕНТА -->
        <div id="student-panel">
            <h2 style="text-align: left;">Доступные знания и лекции</h2>
            <div id="lectures-container">Загрузка материалов учебной программы...</div>
        </div>
    </div>

</div>

<script>
    // Ваша конфигурация проекта Firebase phdtest-95627
    const API_KEY = "AIzaSyBA2CM4hDgqFB1zrwE5es3JgMsA2Aupygo";
    const PROJECT_ID = "phdtest-95627";
    
    // Почта главного администратора сайта
    const ADMIN_EMAIL = "nam.vil.mmtb@gmail.com";

    let isSignUpMode = false; // Режим формы: false = Вход, true = Регистрация
    let currentUser = null;

    // Переключение режимов Вход / Регистрация
    document.getElementById('toggle-auth-mode').addEventListener('click', function() {
        isSignUpMode = !isSignUpMode;
        if (isSignUpMode) {
            document.getElementById('auth-title').innerText = "Регистрация студента";
            document.getElementById('auth-desc').innerText = "Создайте личный профиль для прохождения обучения.";
            document.getElementById('user-name-input').classList.remove('hidden');
            document.getElementById('btn-submit-auth').innerText = "Зарегистрироваться";
            this.innerText = "Уже есть аккаунт? Войти";
        } else {
            document.getElementById('auth-title').innerText = "Вход в Академию";
            document.getElementById('auth-desc').innerText = "Введите свои данные для доступа к учебным материалам.";
            document.getElementById('user-name-input').classList.add('hidden');
            document.getElementById('btn-submit-auth').innerText = "Войти";
            this.innerText = "Нет аккаунта? Зарегистрироваться";
        }
    });

    // Обработка отправки формы (Вход или Регистрация)
    document.getElementById('btn-submit-auth').addEventListener('click', function() {
        const email = document.getElementById('user-email-input').value.trim();
        const password = document.getElementById('user-password-input').value.trim();
        const name = document.getElementById('user-name-input').value.trim();

        if (!email || !password || (isSignUpMode && !name)) {
            return alert("Пожалуйста, заполните все поля формы!");
        }

        if (isSignUpMode) {
            // РЕГИСТРАЦИЯ через нативный REST API Firebase Auth
            const url = `https://googleapis.com{API_KEY}`;
            fetch(url, {
                method: "POST",
                body: JSON.stringify({ email: email, password: password, returnSecureToken: true }),
                headers: { "Content-Type": "application/json" }
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) throw new Error(data.error.message);
                
                // Сохраняем имя профиля
                currentUser = { displayName: name, email: data.email, localId: data.localId };
                localStorage.setItem('user_session_local', JSON.stringify(currentUser));
                alert("Регистрация успешна!");
                renderInterface();
            })
            .catch(err => alert("Ошибка регистрации: " + translateError(err.message)));
        } else {
            // ВХОД через нативный REST API Firebase Auth
            const url = `https://googleapis.com{API_KEY}`;
            fetch(url, {
                method: "POST",
                body: JSON.stringify({ email: email, password: password, returnSecureToken: true }),
                headers: { "Content-Type": "application/json" }
            })
            .then(res => res.json())
            .then(data => {
                if (data.error) throw new Error(data.error.message);
                
                currentUser = { displayName: email.split('@')[0], email: data.email, localId: data.localId };
                localStorage.setItem('user_session_local', JSON.stringify(currentUser));
                renderInterface();
            })
            .catch(err => alert("Ошибка входа: " + translateError(err.message)));
        }
    });

    // Выход из аккаунта
    document.getElementById('btn-logout').addEventListener('click', function() {
        localStorage.removeItem('user_session_local');
        window.location.reload();
    });

    // Отрисовка интерфейса на основе роли пользователя
    function renderInterface() {
        if (!currentUser) return;
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        document.getElementById('user-display-name').innerText = currentUser.displayName;

        const roleBadge = document.getElementById('user-role');
        const adminPanel = document.getElementById('admin-panel');

        if (currentUser.email.toLowerCase().trim() === ADMIN_EMAIL.toLowerCase().trim()) {
            roleBadge.innerText = "Администратор";
            roleBadge.style.background = "#e67e22";
            adminPanel.classList.remove('hidden');
        } else {
            roleBadge.innerText = "Студент";
            roleBadge.style.background = "#2ecc71";
            adminPanel.classList.add('hidden');
        }
        loadLectures();
    }

    // Добавление новой лекции администратором
    document.getElementById('btn-add-lecture').addEventListener('click', function() {
        const title = document.getElementById('lecture-title').value.trim();
        const content = document.getElementById('lecture-content').value.trim();
        if(!title || !content) return alert("Заполните поля названия и текста лекции!");

        const url = `https://googleapis.com{PROJECT_ID}/databases/(default)/documents/lectures`;
        const payload = {
            fields: {
                title: { stringValue: title },
                content: { stringValue: content },
                createdAt: { stringValue: new Date().toISOString() }
            }
        };

        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(() => {
            alert("Лекция успешно опубликована!");
            document.getElementById('lecture-title').value = "";
            document.getElementById('lecture-content').value = "";
            loadLectures();
        })
        .catch(err => alert("Ошибка добавления лекции: " + err.message));
    });

    // Загрузка лекций из Firestore
